    <script>
      // 在页面渲染前就执行主题初始化
      try {
        const storageKey = "vite-ui-theme"
        let theme = localStorage.getItem(storageKey)
        if (theme === "system" || !theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.classList.add(theme)
      } catch (e) {
        document.documentElement.classList.add("light")
      }
    </script>
    <style>
      /* Prevent FOUC in Safari */
      html:not(.dark):not(.light) * {
        visibility: hidden;
      }

      :root {
        color-scheme: light;
        --bg: #ffffff;
      }

      html.dark {
        color-scheme: dark;
        --bg: #242424;
      }

      html.light {
        color-scheme: light;
        --bg: #ffffff;
      }

      html {
        background-color: var(--bg) !important;
      }

      body {
        background-color: var(--bg) !important;
      }

      #root {
        background-color: var(--bg) !important;
        visibility: hidden;
      }

      #root.loaded {
        visibility: visible;
        animation: fadein 0.2s;
      }

      @keyframes fadein {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    </style>
    <script>
      ;(function () {
        const storageKey = "vite-ui-theme"
        const theme = localStorage.getItem(storageKey) || "system"
        const root = document.documentElement

        function updateThemeColor(isDark) {
          const themeColor = isDark ? "#242424" : "#fafafa"
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", themeColor)
        }

        function setTheme(newTheme) {
          root.classList.remove("light", "dark")
          root.classList.add(newTheme)
          updateThemeColor(newTheme === "dark")
        }

        if (theme === "system") {
          const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
          setTheme(systemTheme)

          window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
            setTheme(e.matches ? "dark" : "light")
          })
        } else {
          setTheme(theme)
        }

        // Add loaded class after React has mounted
        window.addEventListener("load", () => {
          const root = document.getElementById("root")
          if (root) {
            // 使用 RAF 确保在下一帧渲染
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                root.classList.add("loaded")
              })
            })
          }
        })
      })()
    </script>

    <script>
      ;(function() {
        const originalPushState = history.pushState
        const originalReplaceState = history.replaceState
        history.pushState = function() {
          const ret = originalPushState.apply(this, arguments)
          window.dispatchEvent(new Event('locationchange'))
          return ret
        }
        history.replaceState = function() {
          const ret = originalReplaceState.apply(this, arguments)
          window.dispatchEvent(new Event('locationchange'))
          return ret
        }
        window.addEventListener('popstate', () => {
          window.dispatchEvent(new Event('locationchange'))
        })
      })();
    </script>
    <script>
      // 移除GPU卡片
      ;(function () {
        "use strict"
        const TAG = "[remove-gpu-if-present]"
        let removed = false

        function findAndRemoveGPU() {
          if (removed) return true
          try {
            const allSections = document.querySelectorAll('section')
            for (const section of allSections) {
              const pElements = section.querySelectorAll('p')
              for (const p of pElements) {
                const text = (p.textContent || "").trim()
                if (/^gpu$/i.test(text)) {
                  const container = section.closest('div[class*="flex"]') || section.parentElement
                  if (container && container !== document.body) {
                    console.info(TAG, '匹配到 "GPU"，将删除容器：', container)
                    container.remove()
                    removed = true
                    return true
                  }
                }
              }
            }
            return false
          } catch (err) {
            return false
          }
        }

        findAndRemoveGPU()

        const mo = new MutationObserver(() => {
          if (findAndRemoveGPU()) {
            mo.disconnect()
          }
        })
        mo.observe(document.body, { childList: true, subtree: true })

        window.addEventListener("locationchange", () => {
          removed = false
          setTimeout(findAndRemoveGPU, 150)
        })

        let tries = 0
        const intervalId = setInterval(() => {
          tries++
          if (findAndRemoveGPU() || tries >= 20) {
            clearInterval(intervalId)
          }
        }, 500)

        console.info(TAG, '脚本注入完成：正在监听 DOM 变化与路由')
      })();
    </script>
    <script>
      ;(function() {
        const IMG_SRC = "https://easyimage.mikus.ink/i/u/2026/01/16/12o9iot.webp"
        let imgAdded = false

        function findServerHeader() {
          const mainContent = document.querySelector('main') || document.body
          const sections = mainContent.querySelectorAll('section')
          for (const section of sections) {
            if (section.querySelector('h1, h2, h3')) {
              return section
            }
          }
          return null
        }

        function addImage() {
          if (imgAdded) return true
          try {
            const section = findServerHeader()
            if (!section) return false
            const container = section.querySelector('div[class*="relative"]') || section.querySelector('div:last-child')
            if (!container) return false

            const existingImg = container.querySelector("img.custom-decor-img")
            if (existingImg) return true

            const imgElement = document.createElement("img")
            imgElement.src = IMG_SRC
            imgElement.className = "custom-decor-img"
            imgElement.style.cssText = "position:absolute;right:8px;top:-80px;z-index:10;width:90px"
            container.appendChild(imgElement)
            imgAdded = true
            return true
          } catch (err) {
            return false
          }
        }

        const observer = new MutationObserver(() => {
          if (addImage()) {
            observer.disconnect()
          }
        })
        observer.observe(document.body, { childList: true, subtree: true })

        window.addEventListener('locationchange', () => {
          imgAdded = false
          setTimeout(addImage, 150)
        })

        addImage()
      })();
    </script>
